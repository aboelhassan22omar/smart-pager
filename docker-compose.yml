services:
  app:
    image: ${APP_IMAGE:-smart-pager:local}
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      NATIVE_DIR: /native
    volumes:
      - pager-data:/data
      - ./secrets:/secrets:ro
      # Cashier app templates, copied here by CD (see apps/ and .github/workflows/apps-build.yml)
      - ./native:/native:ro
    # Loopback only: reached through Caddy (below) or an existing host Nginx.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Enabled with COMPOSE_PROFILES=caddy in .env. Leave it off when the host already runs Nginx on 80/443.
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pager-data:
  caddy-data:
  caddy-config:
