[package]
name = "cashier"
version = "1.0.0"
edition = "2021"
publish = false
description = "Cashier"

[dependencies]
serde_json = "1"
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
