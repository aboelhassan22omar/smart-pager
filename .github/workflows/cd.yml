name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A squash merge of an up-to-date PR has exactly the tree CI already tested on the PR,
  # so CI is not repeated. Anything else (manual run, admin bypass, failed or missing
  # checks) runs the full CI below.
  verify:
    name: Stage 1 - CI passed on the PR?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.pr.outputs.verified }}
    steps:
      - name: Look up the merged PR and its checks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REQUIRED: >-
            CI - Syntax check|CI - Lint|CI - Backend tests|CI - Frontend tests|CI - Asset audit|CI - Docker Compose validation|CI - Image build (linux/amd64)|CI - Image build (linux/arm64)
        run: |
          verified=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] | "\(.number) \(.head.sha)"' 2>/dev/null || true)"
            if [ -n "$pr" ] && [ "$pr" != "null null" ]; then
              number="${pr%% *}"
              head="${pr##* }"
              missing=0
              IFS='|' read -ra names <<< "$REQUIRED"
              for name in "${names[@]}"; do
                ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" \
                  --jq "[.check_runs[] | select(.name == \"$name\" and .conclusion == \"success\")] | length")"
                if [ "${ok:-0}" -lt 1 ]; then
                  echo "::notice::#$number has no successful \"$name\""
                  missing=1
                fi
              done
              if [ "$missing" = 0 ]; then
                verified=true
                echo "Merged from #$number; all required checks passed on $head. Skipping CI re-run."
              fi
            fi
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  ci:
    name: Stage 1 - CI
    needs: verify
    if: needs.verify.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  changes:
    name: Stage 2 - Detect changed services
    needs: [verify, ci]
    if: >-
      always()
      && needs.verify.result == 'success'
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Only what ships matters: tests, lint config, docs and workflow edits never redeploy.
          filters: |
            app:
              - 'server/src/**'
              - 'server/public/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/Dockerfile'
              - 'server/.dockerignore'
            infra:
              - 'docker-compose.yml'
              - 'Caddyfile'
              - 'deploy/**'
            ios:
              - 'ios/**'
      - name: Summary
        env:
          APP: ${{ steps.filter.outputs.app }}
          INFRA: ${{ steps.filter.outputs.infra }}
          IOS: ${{ steps.filter.outputs.ios }}
        run: |
          {
            echo "### Changed services"
            echo "| service | changed |"
            echo "|---|---|"
            echo "| app | $APP |"
            echo "| infra | $INFRA |"
            echo "| ios | $IOS |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-app:
    name: CD - Publish app image
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repo=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Saved on main; PR image builds read it too (PR caches are not readable from main).
          cache-from: type=gha,scope=app-release
          cache-to: type=gha,mode=max,scope=app-release

  release-gate:
    name: CD - All release images published
    needs: [changes, publish-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release images
        env:
          CHANGES: ${{ needs.changes.result }}
          PUBLISH: ${{ needs.publish-app.result }}
        run: |
          echo "changes=$CHANGES publish-app=$PUBLISH"
          [ "$CHANGES" = "success" ] || { echo "::error::change detection did not succeed"; exit 1; }
          case "$PUBLISH" in
            success|skipped) echo "All release images are published." ;;
            *) echo "::error::app image publish $PUBLISH"; exit 1 ;;
          esac

  deploy:
    name: Stage 3 - Deploy production
    needs: [changes, publish-app, release-gate]
    if: >-
      always()
      && needs.release-gate.result == 'success'
      && vars.DEPLOY_PATH != ''
      && (needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_HOST, SSH_USER and SSH_PRIVATE_KEY secrets are required"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host prod"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config

      - name: Copy deploy script
        run: |
          # Variables are meant to expand on the runner side.
          # shellcheck disable=SC2029
          ssh prod "mkdir -p '$DEPLOY_PATH/secrets'"
          scp deploy/remote-deploy.sh "prod:$DEPLOY_PATH/"

      # Compose files only travel when they changed (or on a manual full deploy).
      - name: Copy compose files
        if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        run: scp docker-compose.yml Caddyfile .env.example "prod:$DEPLOY_PATH/"

      - name: Update changed services
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_CHANGED: ${{ needs.publish-app.result == 'success' }}
          NEW_IMAGE: ${{ needs.publish-app.outputs.image }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          image="-"
          if [ "$APP_CHANGED" = "true" ]; then image="$NEW_IMAGE"; fi
          # The token goes over stdin, never on a command line.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh prod \
            "bash '$DEPLOY_PATH/remote-deploy.sh' '$DEPLOY_PATH' '$GITHUB_ACTOR' '$image' 20 '$INFRA_CHANGED'"

      - name: Public health check
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          [ -n "$PUBLIC_URL" ] || { echo "vars.PUBLIC_URL not set; skipping"; exit 0; }
          for _ in $(seq 1 10); do
            if curl -fsS "$PUBLIC_URL/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::$PUBLIC_URL/health is not reachable"
          exit 1
