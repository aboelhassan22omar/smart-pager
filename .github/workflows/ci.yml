name: CI

# Runs once per change: on the pull request (the merge gate), and from cd.yml only
# when main gets a commit that did not come through a checked PR.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  deps:
    name: CI - Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Restore node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: server/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('server/package-lock.json') }}
      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  check:
    name: CI - Syntax check
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: server/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('server/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run check

  lint:
    name: CI - Lint
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: server/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('server/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run lint
      - name: actionlint
        working-directory: .
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  backend:
    name: CI - Backend tests
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: server/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('server/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm test

  frontend:
    name: CI - Frontend tests
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: server/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('server/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run test:frontend

  audit:
    name: CI - Asset audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: CI - Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=pager.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    name: CI - Image build
    needs: [check, lint, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Cache scope
        id: scope
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "name=app-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: matrix.platform != 'linux/amd64'
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: smart-pager:ci
          cache-from: |
            type=gha,scope=${{ steps.scope.outputs.name }}
            type=gha,scope=app-release
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.name }}
      - name: Smoke test
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run -d --name pager -p 3000:3000 \
            -e ADMIN_TOKEN=ci-token -e PUBLIC_URL=http://localhost:3000 smart-pager:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && break
            sleep 1
          done
          curl -fsS -X POST http://localhost:3000/api/admin/shops \
            -H 'x-admin-token: ci-token' -H 'content-type: application/json' \
            -d '{"id":"smoke-cafe","name":"Smoke Cafe","pin":"1234"}'
          curl -fsS http://localhost:3000/api/b/smoke-cafe | grep -q '"id":"smoke-cafe"'
          curl -fsS http://localhost:3000/s/smoke-cafe | grep -q 'dir="rtl"'
          docker exec pager id -u | grep -qv '^0$'
          echo "smoke test passed"
      - name: Container logs
        if: failure() && matrix.platform == 'linux/amd64'
        run: docker logs pager || true

  ios-changes:
    name: CI - Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'

  ios:
    name: CI - iOS build
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      # App Store needs Xcode 26+; Xcode 27.1+ (iOS 27.1 SDK) also makes the app fill iPhone Duo.
      - name: Select newest Xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          version=$(xcodebuild -version | awk 'NR==1 {print $2}')
          echo "$version" | awk '{split($1, v, "."); exit !(v[1] >= 26)}'             || { echo "::error::Xcode $version is older than 26; App Store Connect rejects it"; exit 1; }
          echo "$version" | awk '{split($1, v, "."); exit !(v[1] > 27 || (v[1] == 27 && v[2] >= 1))}'             || echo "::warning::Xcode $version on this runner: builds run, but iPhone Duo optimization needs Xcode 27.1+"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        env:
          PAGER_DOMAIN: pager.example.com
          ALLOW_XCODE_26: "1"
        run: bash generate.sh
      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SmartPager.xcodeproj -scheme SmartPager -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet
      - name: Build App Clip (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SmartPager.xcodeproj -scheme SmartPagerClip -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet

  apps-changes:
    name: CI - Detect cashier app changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
              - 'server/src/native/**'
              - 'server/src/routes/app.js'
              - '.github/workflows/apps-build.yml'

  # Builds both apps and runs them for real (Android emulator, Windows WebView2). Only when they changed.
  apps:
    name: CI - Cashier apps
    needs: apps-changes
    if: needs.apps-changes.outputs.apps == 'true'
    uses: ./.github/workflows/apps-build.yml
