version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # ESLint 9 flat config is a project requirement; eslint and @eslint/js majors must move together.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    # CI tests on Node 22; a Node major is a deliberate upgrade of CI + image together.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
