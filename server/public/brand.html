<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>فروعي — Smart Pager</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/css/bs-bridge.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/owner.css">
  <script type="module" src="/js/powered.js"></script>
  <script type="module" src="/js/brand.js"></script>
</head>
<body data-powered="inline">
  <div id="login-root"></div>

  <div id="app" class="owner" hidden>
    <header class="owner-bar sticky-top">
      <div class="container-xl d-flex align-items-center gap-3">
        <span class="owner-logo" id="brand-logo" aria-hidden="true"></span>
        <div class="flex-grow-1 min-w-0">
          <h1 class="owner-title text-truncate" id="brand-name"></h1>
          <p class="owner-sub text-truncate" id="owner-line"></p>
        </div>
        <nav class="nav nav-pills owner-tabs d-none d-md-flex" aria-label="الأقسام" data-tabs></nav>
      </div>
    </header>

    <main class="container-xl owner-main">
      <section class="owner-pane" id="pane-branches" data-pane="branches" aria-labelledby="h-branches">
        <h2 class="visually-hidden" id="h-branches">الفروع</h2>
        <div id="today" class="today" aria-label="النهارده في كل الفروع"></div>
        <div id="branches"></div>
      </section>

      <section class="owner-pane analytics" id="analytics" data-pane="analytics" aria-label="التحليلات" hidden></section>

      <section class="owner-pane" data-pane="apps" aria-label="التطبيقات" hidden>
        <div class="dash-head"><h2 id="h-owner-app">تطبيقك أنت</h2></div>
        <div id="owner-app-body" class="stack-lg"></div>
        <div class="dash-head"><h2 id="h-app">تطبيق الكاشير</h2></div>
        <div id="app-body" class="stack-lg"></div>
      </section>

      <section class="owner-pane" data-pane="account" aria-labelledby="h-account" hidden>
        <div class="dash-head"><h2 id="h-texts">الكلام اللي العميل بيشوفه</h2></div>
        <div id="texts-body" class="stack-lg"></div>
        <div class="dash-head"><h2 id="h-account">حسابي</h2></div>
        <div id="account-body" class="stack-lg"></div>
      </section>
    </main>

    <nav class="tabbar d-md-none" aria-label="الأقسام" data-tabs></nav>
  </div>
</body>
</html>
