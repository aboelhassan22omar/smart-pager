<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>فروعي — Smart Pager</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/powered.js"></script>
  <script type="module" src="/js/brand.js"></script>
</head>
<body>
  <div id="login-root"></div>

  <div id="app" hidden>

      <nav>

    <main class="dash">

        <div><h2>الفروع</h2><p class="sub" id="owner-line"></p></div>
      </div>
      <div id="branches"></div>
      <section class="apps-section" id="app-section" aria-labelledby="h-app" hidden>
        <div class="dash-head"><h2 id="h-app">تطبيق الكاشير</h2></div>
        <div id="app-body" class="stack-lg"></div>
      </section>
      <section class="analytics" id="analytics" aria-label="التحليلات"></section>
    </main>
  </div>

</html>
