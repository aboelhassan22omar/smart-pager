<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>تشغيل التطبيق</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/setup.js"></script>
</head>
<body>
  <main class="get-app">
    <header class="app-head">
      <img id="icon" class="app-icon" src="/img/app-icon.png" alt="" width="88" height="88">
      <h1 id="brand-name">تشغيل التطبيق</h1>
      <p class="muted" id="intro">أول مرة بس: اختار الفرع واكتب الرقم السري بتاعه.</p>
    </header>

    <form id="link" class="panel stack" novalidate hidden>
      <label class="field" for="branch"><span>الفرع</span>
        <select class="input" id="branch" name="branchId" required></select>
      </label>
      <label class="field" for="pin"><span>الرقم السري بتاع الفرع</span>
        <input class="input" id="pin" name="pin" type="password" inputmode="numeric" dir="ltr" maxlength="8" autocomplete="off" required>
      </label>
      <label class="field" for="name"><span>اسم الجهاز (اختياري)</span>
        <input class="input" id="name" name="name" maxlength="40" placeholder="مثلًا: كاشير 1" autocomplete="off">
      </label>
      <p class="form-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">ابدأ</button>
    </form>

    <p id="error" class="panel muted" hidden></p>
  </main>
</body>
</html>
