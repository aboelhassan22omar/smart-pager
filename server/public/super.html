<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1f21">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>لوحة الإدارة — Smart Pager</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/powered.js"></script>
  <script type="module" src="/js/super.js"></script>
</head>
<body>
  <div id="login-root"></div>

  <div id="app" hidden>
    <header class="topbar">
      <h1>لوحة الإدارة</h1>
      <nav>
        <button class="btn btn-primary btn-sm" id="new-brand" type="button">براند جديد</button>
        <button class="icon-link" id="logout" type="button" aria-label="خروج" title="خروج"></button>
      </nav>
    </header>

    <main class="dash">
      <section class="attention" aria-labelledby="h-attention">
        <h2 id="h-attention">محتاج منك</h2>
        <ul id="attention"></ul>
      </section>

      <div id="brands"></div>

      <section class="activity" aria-labelledby="h-activity">
        <div class="dash-head">
          <h2 id="h-activity">آخر العمليات</h2>
          <label class="check"><input type="checkbox" id="show-logins"> اعرض تسجيلات الدخول</label>
        </div>
        <ol id="activity"></ol>
        <button class="btn btn-sm btn-quiet" id="activity-more" type="button" hidden>اعرض أكتر</button>
      </section>
    </main>
  </div>
</body>
</html>
