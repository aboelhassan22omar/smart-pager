<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1f21">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>تطبيق الكاشير</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/get-app.js"></script>
</head>
<body>
  <main class="get-app">
    <header class="app-head">
      <img id="icon" class="app-icon" src="/img/app-icon.png" alt="" width="88" height="88">
      <h1 id="brand-name">تطبيق الكاشير</h1>
      <p class="muted">تطبيق الكاشير للفروع</p>
    </header>

    <form id="unlock" class="panel stack" novalidate hidden>
      <label class="field" for="password"><span>الباسورد اللي وصلك مع اللينك</span>
        <input class="input" id="password" name="password" type="password" dir="ltr" autocomplete="off" required>
      </label>
      <p class="form-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">كمّل</button>
    </form>

    <section id="downloads" class="stack" hidden>
      <div id="platforms" class="platforms"></div>
      <section class="panel" aria-labelledby="steps-title">
        <h2 id="steps-title"></h2>
        <ol id="steps" class="steps"></ol>
      </section>
    </section>

    <p id="error" class="panel muted" hidden></p>
  </main>
</body>
</html>
